<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans antialiased">

<div class="max-w-3xl mx-auto py-12 px-4">
    <div class="mb-6">
        <a href="/admin/buses" class="text-slate-500 hover:text-blue-600 flex items-center transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Quay lại danh sách
        </a>
    </div>

    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        <div class="bg-slate-900 p-8 text-white">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-2xl font-bold" th:text="${bus.id == null ? 'Thêm Xe Mới' : 'Cập Nhật Thông Tin Xe'}">Quản lý Xe</h2>
                    <p class="text-slate-400 text-sm mt-1">Cấu hình biển số, loại xe và lộ trình di chuyển</p>
                </div>
                <div class="bg-blue-500/20 p-3 rounded-full">
                    <i data-lucide="bus" class="w-8 h-8 text-blue-400"></i>
                </div>
            </div>
        </div>

        <form th:action="@{/admin/buses/save}" th:object="${bus}" method="post" class="p-8 space-y-6">
            <input type="hidden" th:field="*{id}">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-700 flex items-center">
                        <i data-lucide="hash" class="w-4 h-4 mr-1 text-slate-400"></i> Biển số xe
                    </label>
                    <input type="text" th:field="*{plateNumber}"
                           class="w-full border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder:text-slate-300"
                           placeholder="VD: 29B-123.45" required>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-700 flex items-center">
                        <i data-lucide="settings" class="w-4 h-4 mr-1 text-slate-400"></i> Loại xe
                    </label>
                    <select th:field="*{busType}"
                            class="w-full border border-slate-200 rounded-xl p-3 bg-white focus:ring-2 focus:ring-blue-500 outline-none appearance-none">
                        <option value="Giường nằm">🛌 Giường nằm</option>
                        <option value="Ghế ngồi">💺 Ghế ngồi</option>
                        <option value="Limousine">✨ Limousine cao cấp</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-700 flex items-center">
                        <i data-lucide="users" class="w-4 h-4 mr-1 text-slate-400"></i> Tổng số ghế
                    </label>
                    <input type="number" th:field="*{totalSeats}"
                           class="w-full border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                           required min="1">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-semibold text-slate-700 flex items-center">
                        <i data-lucide="map-pin" class="w-4 h-4 mr-1 text-slate-400"></i> Tuyến đường cố định
                    </label>
                    <select th:field="*{route.id}"
                            class="w-full border border-slate-200 rounded-xl p-3 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        <option th:each="r : ${routes}"
                                th:value="${r.id}"
                                th:text="${r.departure.name + ' → ' + r.destination.name}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="pt-6 border-t border-slate-100 flex gap-4">
                <button type="submit"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 transition-all flex items-center justify-center">
                    <i data-lucide="save" class="w-5 h-5 mr-2"></i> LƯU THÔNG TIN
                </button>
                <a href="/admin/buses"
                   class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-4 rounded-xl transition-all text-center">
                    HỦY BỎ
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    // Kích hoạt icons của Lucide
    lucide.createIcons();
</script>
</body>
</html>
