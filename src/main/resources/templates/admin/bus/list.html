<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100">
<div class="flex">
    <div th:replace="~{admin/fragments :: admin_sidebar}"></div>
    <div class="flex-1 p-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Danh mục Xe (Bus)</h2>
            <a href="/admin/buses/add" class="bg-blue-600 text-white px-4 py-2 rounded-lg flex items-center hover:bg-blue-700">
                <i data-lucide="plus" class="mr-2"></i> Thêm xe mới
            </a>
        </div>

        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b">
                <tr>
                    <th class="p-4 font-semibold">Biển số</th>
                    <th class="p-4 font-semibold">Loại xe</th>
                    <th class="p-4 font-semibold">Số ghế</th>
                    <th class="p-4 font-semibold">Tuyến đường</th>
                    <th class="p-4 font-semibold text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="bus : ${buses}" class="border-b hover:bg-gray-50">
                    <td class="p-4 font-bold text-blue-600" th:text="${bus.plateNumber}"></td>
                    <td class="p-4 text-gray-600" th:text="${bus.busType}"></td>
                    <td class="p-4 text-gray-600" th:text="${bus.totalSeats}"></td>
                    <td class="p-4 text-gray-600"
                        th:text="${bus.route.departure.name + ' → ' + bus.route.destination.name}">
                    </td>
                    <td class="p-4 flex justify-center space-x-2">
                        <a th:href="@{/admin/buses/edit/{id}(id=${bus.id})}" class="p-2 text-yellow-600 hover:bg-yellow-100 rounded-lg">
                            <i data-lucide="pencil" class="w-5 h-5"></i>
                        </a>
                        <a th:href="@{/admin/buses/delete/{id}(id=${bus.id})}" onclick="return confirm('Xóa xe này?')" class="p-2 text-red-600 hover:bg-red-100 rounded-lg">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
