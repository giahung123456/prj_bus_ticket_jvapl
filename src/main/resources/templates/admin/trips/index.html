<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 flex">

<!-- Sidebar Fragment -->
<div th:replace="~{admin/fragments :: admin_sidebar}"></div>

<!-- Main Content -->
<main class="flex-1 p-8">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">Quản lý Chuyến đi</h2>
        <button onclick="document.getElementById('tripModal').showModal()"
                class="bg-blue-600 text-white px-5 py-2.5 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all flex items-center">
            <i data-lucide="plus" class="w-5 h-5 mr-2"></i> Tạo chuyến mới
        </button>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-left">
            <thead class="bg-slate-50 border-b border-slate-200">
            <tr>
                <th class="p-4 font-semibold text-slate-600">Thời gian đi</th>
                <th class="p-4 font-semibold text-slate-600">Tuyến đường</th>
                <th class="p-4 font-semibold text-slate-600">Xe / Biển số</th>
                <th class="p-4 font-semibold text-slate-600">Giá vé</th>
                <th class="p-4 font-semibold text-slate-600">Thao tác</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="trip : ${trips}" class="hover:bg-slate-50 transition">
                <td class="p-4">
                    <div class="font-medium text-slate-900" th:text="${#temporals.format(trip.departureTime, 'HH:mm dd/MM/yyyy')}">08:00 10/05/2026</div>
                </td>
                <td class="p-4">
                    <span class="text-blue-600 font-semibold" th:text="${trip.route.departure.name}">Hà Nội</span>
                    <i data-lucide="arrow-right" class="inline w-4 h-4 mx-1 text-slate-400"></i>
                    <span class="text-red-600 font-semibold" th:text="${trip.route.destination.name}">Hải Phòng</span>
                </td>
                <td class="p-4">
                    <div class="text-sm font-medium" th:text="${trip.bus.busType}">Giường nằm</div>
                    <div class="text-xs text-slate-500" th:text="${trip.bus.plateNumber}">29B-123.45</div>
                </td>
                <td class="p-4 font-bold text-green-600" th:text="${#numbers.formatDecimal(trip.price, 0, 'COMMA', 0, 'POINT') + 'đ'}">150,000đ</td>
                <td class="p-4">
                    <button class="p-2 text-slate-400 hover:text-blue-600"><i data-lucide="edit"></i></button>
                    <button class="p-2 text-slate-400 hover:text-red-600"><i data-lucide="trash-2"></i></button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- Modal Form -->
<dialog id="tripModal" class="rounded-2xl shadow-2xl p-0 w-full max-w-lg backdrop:bg-slate-900/60">
    <div class="p-8">
        <h3 class="text-xl font-bold mb-6 text-slate-800">Cấu hình Chuyến đi</h3>
        <form th:action="@{/admin/trips/save}" method="post" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Tuyến đường cố định</label>
                <select name="route.id" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500">
                    <option th:each="r : ${routes}" th:value="${r.id}"
                            th:text="${r.departure.name + ' → ' + r.destination.name}"></option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Xe vận hành</label>
                <select name="bus.id" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl">
                    <option th:each="b : ${buses}" th:value="${b.id}"
                            th:text="${b.plateNumber + ' (' + b.busType + ')'}"></option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Thời gian khởi hành</label>
                    <input type="datetime-local" name="departureTime" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl" required>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Giá vé (VNĐ)</label>
                    <input type="number" name="price" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl" placeholder="150000" required>
                </div>
            </div>

            <div class="flex justify-end space-x-3 pt-6">
                <button type="button" onclick="this.closest('dialog').close()" class="px-6 py-2.5 font-medium text-slate-500 hover:text-slate-700">Đóng</button>
                <button type="submit" class="px-8 py-2.5 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition-all">Lưu Chuyến</button>
            </div>
        </form>
    </div>
</dialog>

<script>lucide.createIcons();</script>
</body>
</html>
