<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50">
<div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-64 bg-slate-900 text-white p-6 shadow-xl">
        <h1 class="text-2xl font-bold text-blue-400 mb-10 flex items-center">
            <i data-lucide="shield-check" class="mr-2"></i> Admin Pro
        </h1>
        <nav class="space-y-4">
            <a href="#" class="flex items-center p-3 bg-blue-600 rounded-lg"><i data-lucide="layout-dashboard" class="mr-3"></i> Dashboard</a>
            <a href="/admin/buses" class="flex items-center p-3 hover:bg-slate-800 rounded-lg">
                <i data-lucide="bus" class="mr-3"></i> Quản lý Xe
            </a>
            <a href="/admin/routes" class="flex items-center p-3 hover:bg-slate-800 rounded-lg transition-all"
               th:classappend="${activePage == 'routes' ? 'bg-blue-600' : ''}">
                <i data-lucide="map-pinned" class="mr-3"></i> Tuyến đường
            </a>
            <!-- Thêm đoạn này vào trong thẻ <nav> của Sidebar -->
            <a href="/admin/trips" class="flex items-center p-3 hover:bg-slate-800 rounded-lg transition-all"
               th:classappend="${activePage == 'trips' ? 'bg-blue-600' : ''}">
                <i data-lucide="calendar-days" class="mr-3"></i> Quản lý Chuyến đi
            </a>
            <a href="#" class="flex items-center p-3 hover:bg-slate-800 rounded-lg"><i data-lucide="bar-chart-3" class="mr-3"></i> Báo cáo doanh thu</a>
            <div class="pt-10">
                <a href="/logout" class="flex items-center p-3 text-red-400 hover:bg-red-900/20 rounded-lg"><i data-lucide="log-out" class="mr-3"></i> Đăng xuất</a>
            </div>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-y-auto p-8">
        <header class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold text-slate-800">Hệ thống Quản trị</h2>
            <!-- THAY BẰNG MỚI (Thêm thẻ <a> bao quanh tên để click vào được) -->
            <div class="flex items-center space-x-4">
                <a href="/profile" class="flex items-center space-x-2 hover:text-blue-600 transition-all">
                    <span class="text-slate-600 font-medium" sec:authentication="name">Admin_Master</span>
                    <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold border-2 border-white shadow-sm">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </div>
                </a>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <header class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-slate-800">Hệ thống Quản trị</h2>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-slate-500 font-medium">Tổng số xe</p>
                    <h3 class="text-4xl font-bold text-slate-800 mt-2" th:text="${totalBuses}">0</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-green-500">
                    <p class="text-slate-500 font-medium">Doanh thu tháng này</p>
                    <h3 class="text-4xl font-bold text-green-600 mt-2"
                        th:text="${monthlyRevenue != null ? #numbers.formatDecimal(monthlyRevenue, 0, 'COMMA', 0, 'POINT') + 'đ' : '0đ'}">0đ</h3>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-slate-500 font-medium">Top chuyến xe</p>
                    <h3 class="text-4xl font-bold text-blue-600 mt-2" th:text="${topTrips.size()}">0</h3>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold mb-4 text-slate-700 flex items-center">
                        <i data-lucide="bar-chart" class="w-5 h-5 mr-2 text-blue-500"></i> Doanh thu theo tuyến đường
                    </h3>
                    <canvas id="revenueChart" height="200"></canvas>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold mb-4 text-slate-700 flex items-center">
                        <i data-lucide="trending-up" class="w-5 h-5 mr-2 text-orange-500"></i> Top 5 Chuyến xe đông khách
                    </h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                            <tr class="text-slate-400 text-xs uppercase border-b">
                                <th class="pb-3">Tuyến</th>
                                <th class="pb-3 text-right">Lượt đặt</th>
                            </tr>
                            </thead>
                            <tbody class="divide-y">
                            <tr th:each="t : ${topTrips}" class="hover:bg-slate-50 transition-colors">
                                <td class="py-4 font-medium text-slate-700" th:text="${t.routeName}">Hà Nội - Hải Phòng</td>
                                <td class="py-4 text-right font-bold text-blue-600" th:text="${t.bookingCount}">0</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>lucide.createIcons();</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    // Lấy dữ liệu từ Model truyền qua
    const revenueData = /*[[${routeRevenue}]]*/ [];

    document.addEventListener('DOMContentLoaded', function() {
        const ctx = document.getElementById('revenueChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: revenueData.map(item => item.routeName),
                datasets: [{
                    label: 'Doanh thu (VNĐ)',
                    data: revenueData.map(item => item.totalRevenue),
                    backgroundColor: 'rgba(59, 130, 246, 0.8)',
                    borderColor: 'rgb(59, 130, 246)',
                    borderWidth: 1,
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { display: false } },
                    x: { grid: { display: false } }
                },
                plugins: { legend: { display: false } }
            }
        });
    });
    /*]]>*/
</script>
</body>
</html>
