<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 h-screen flex items-center justify-center">
<div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Đăng Ký Tài Khoản</h2>

    <form th:action="@{/register}" th:object="${user}" method="post" class="space-y-4">
        <!-- Username -->
<!--        <div>-->
<!--            <label class="block text-sm font-medium text-gray-700">Tên đăng nhập</label>-->
<!--            <input type="text" th:field="*{username}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">-->
<!--            <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>-->
<!--        </div>-->
<!--        <div>-->
<!--            <label class="block text-sm font-medium text-gray-700">Tên đăng nhập</label>-->
<!--            <input type="text" th:field="*{username}"-->
<!--                   class="mt-1 block w-full border rounded-md p-2"-->
<!--                   th:classappend="${#fields.hasErrors('username')} ? 'border-red-500' : 'border-gray-300'">-->
<!--            <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>-->
<!--        </div>-->
        <div>
            <label class="block text-sm font-medium text-gray-700">Tên đăng nhập</label>
            <input type="text" th:field="*{username}"

                   class="mt-1 block w-full border rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500"
                   th:classappend="${#fields.hasErrors('username')} ? 'border-red-500 shadow-sm' : 'border-gray-300'">

            <p class="text-red-500 text-xs mt-1 font-semibold"
               th:if="${#fields.hasErrors('username')}"
               th:errors="*{username}"></p>
        </div>
        <!-- Password -->
        <div>
            <label class="block text-sm font-medium text-gray-700">Mật khẩu</label>
            <input type="password" th:field="*{password}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <!-- Full Name -->
        <div>
            <label class="block text-sm font-medium text-gray-700">Họ và tên</label>
            <input type="text" th:field="*{fullName}"

                   class="mt-1 block w-full border rounded-md p-2">
            <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
        </div>

        <!-- Phone -->
<!--        <div>-->
<!--            <label class="block text-sm font-medium text-gray-700">Số điện thoại</label>-->
<!--            <input type="text" th:field="*{phoneNumber}" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">-->
<!--        </div>-->
        <div>
            <label class="block text-sm font-medium text-gray-700">Số điện thoại</label>
            <input type="text" th:field="*{phoneNumber}"
                   class="mt-1 block w-full border rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500"
                   th:classappend="${#fields.hasErrors('phoneNumber')} ? 'border-red-500' : 'border-gray-300'">
            <p class="text-red-500 text-xs mt-1" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 transition duration-200">Đăng Ký</button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
        Đã có tài khoản? <a href="/login" class="text-blue-600 hover:underline">Đăng nhập ngay</a>
    </p>
</div>
</body>

</html>
