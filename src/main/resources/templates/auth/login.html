<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | BusTicket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50">
<div class="min-h-screen flex">
  <div class="hidden lg:flex lg:w-1/2 bg-blue-600 relative items-center justify-center p-12 overflow-hidden">
    <div class="absolute inset-0 z-0">
      <img src="https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&q=80&w=2069"
           class="w-full h-full object-cover opacity-30" alt="Bus background">
      <div class="absolute inset-0 bg-gradient-to-t from-blue-900 via-transparent to-blue-800"></div>
    </div>

    <div class="relative z-10 text-white max-w-md">
      <div class="flex items-center gap-2 mb-8">
        <div class="bg-white p-2 rounded-xl">
          <i data-lucide="bus" class="text-blue-600 w-8 h-8"></i>
        </div>
        <span class="text-2xl font-bold tracking-tight">BusTicket</span>
      </div>
      <h1 class="text-5xl font-extrabold leading-tight mb-6">Hành trình mới bắt đầu từ đây.</h1>
      <p class="text-blue-100 text-lg leading-relaxed">Đăng nhập để quản lý những chuyến đi của bạn và nhận ưu đãi độc quyền hàng ngày.</p>
    </div>
  </div>

  <div class="w-full lg:w-1/2 flex items-center justify-center p-8 bg-white">
    <div class="w-full max-w-md">
      <div class="mb-10">
        <h2 class="text-3xl font-bold text-slate-800">Chào mừng trở lại!</h2>
        <p class="text-slate-500 mt-2">Vui lòng nhập thông tin để truy cập tài khoản.</p>
      </div>


      <div th:if="${successMsg}" class="mb-6 p-4 bg-green-50 border-l-4 border-green-500 text-green-700 text-sm" th:text="${successMsg}"></div>
      <div th:if="${param.error}" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm">Sai tài khoản hoặc mật khẩu!</div>
      <div th:if="${error}" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4"></i>
        <span th:text="${error}"></span>
      </div>
      <form th:action="@{/login}" method="post" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Tên đăng nhập</label>
          <div class="relative">
            <i data-lucide="user" class="absolute left-3 top-3 w-5 h-5 text-slate-400"></i>
            <input type="text" name="username" placeholder="Nhập tên đăng nhập"
                   class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Mật khẩu</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-3 top-3 w-5 h-5 text-slate-400"></i>
            <input type="password" name="password" placeholder="••••••••"
                   class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
          </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-200 transition-all">
          Đăng nhập
        </button>
      </form>

      <p class="mt-8 text-center text-slate-600">
        Chưa có tài khoản? <a href="/register" class="text-blue-600 font-bold hover:underline">Đăng ký ngay</a>
      </p>
    </div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
