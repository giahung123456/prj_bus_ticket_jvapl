<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>$Title$</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
<div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
  <h2 class="text-2xl font-bold mb-6 text-center text-green-600">Đăng Nhập</h2>
  <div th:if="${error}" class="mb-4 p-3 bg-red-100 text-red-700 rounded-md text-sm border border-red-200">
    <span th:text="${error}"></span>
  </div>
  <!-- Hiển thị thông báo thành công từ RedirectAttributes -->
  <div th:if="${successMsg}" class="mb-4 p-3 bg-green-100 text-green-700 rounded-md text-sm">
    <span th:text="${successMsg}"></span>
  </div>
  <!-- Thông báo lỗi khi đăng nhập thất bại -->
  <div th:if="${param.error}" class="mb-4 p-3 bg-red-100 text-red-700 rounded-md text-sm border border-red-200">
    Tên đăng nhập hoặc mật khẩu không chính xác!
  </div>

  <!-- Thông báo khi người dùng vừa Logout -->
  <div th:if="${param.logout}" class="mb-4 p-3 bg-blue-100 text-blue-700 rounded-md text-sm">
    Bạn đã đăng xuất thành công.
  </div>

  <form th:action="@{/login}" method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700">Tên đăng nhập</label>
      <input type="text" name="username"  class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Mật khẩu</label>
      <input type="password" name="password"  class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
    </div>

    <button type="submit" class="w-full bg-green-600 text-white p-2 rounded-md hover:bg-green-700 transition duration-200">Đăng Nhập</button>
  </form>

  <p class="mt-4 text-center text-sm text-gray-600">
    Chưa có tài khoản? <a href="/register" class="text-green-600 hover:underline">Đăng ký tại đây</a>
  </p>
</div>
</body>
</html>
