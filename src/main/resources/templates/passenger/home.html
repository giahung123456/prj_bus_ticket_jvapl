<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-white">
<!-- Hero Section with Search -->
<header class="bg-gradient-to-r from-blue-700 to-blue-500 text-white pb-20">
    <nav class="p-6 flex justify-between items-center max-w-7xl mx-auto">

        <div class="space-x-6 flex items-center">
            <th:block th:if="${session.loggedInUser != null}">
                <a href="/history" class="flex items-center hover:text-orange-200 transition"><i data-lucide="history" class="w-4 h-4 mr-1"></i> Lịch sử</a>
                <a href="/profile" class="flex items-center hover:text-orange-200 transition"><i data-lucide="user-cog" class="w-4 h-4 mr-1"></i> Cá nhân</a>
                <a href="/logout" class="bg-white text-blue-600 px-5 py-2 rounded-full font-bold shadow-lg hover:bg-blue-50 transition">Đăng xuất</a>
            </th:block>

            <th:block th:if="${session.loggedInUser == null}">
                <a href="/login" class="bg-orange-400 text-white px-5 py-2 rounded-full font-bold shadow-lg hover:bg-orange-500 transition">Đăng nhập</a>
            </th:block>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto text-center mt-16 px-4">
        <h2 class="text-4xl font-extrabold mb-4">Bạn muốn đi đâu hôm nay?</h2>
        <p class="text-blue-100 mb-10">Cam kết giá rẻ nhất - Chống tranh chấp ghế thời gian thực</p>


        <form th:action="@{/booking/search}" method="get" class="bg-white p-4 rounded-2xl shadow-2xl flex flex-col md:flex-row gap-4 text-slate-800">

            <div class="flex-1 text-left">
                <label class="text-xs font-bold text-slate-400 uppercase ml-2">Điểm đi</label>
                <select name="departure" class="w-full p-2 outline-none border-b-2 border-transparent focus:border-blue-500">
                    <option value="">Chọn điểm đi...</option>
                    <option th:each="p : ${departures}" th:value="${p}" th:text="${p}"></option>
                </select>
            </div>

            <div class="flex-1 text-left border-l border-slate-100 pl-4">
                <label class="text-xs font-bold text-slate-400 uppercase ml-2">Điểm đến</label>
                <select name="destination" class="w-full p-2 outline-none border-b-2 border-transparent focus:border-blue-500" required>
                    <option value="">Chọn điểm đến...</option>
                    <th:block th:each="dest : ${destinations}">
                        <option th:value="${dest}" th:text="${dest}"></option>
                    </th:block>
                </select>
            </div>

            <div class="flex-1 text-left border-l border-slate-100 pl-4">
                <label class="text-xs font-bold text-slate-400 uppercase ml-2">Ngày đi</label>
                <input type="date" name="date" required
                       class="w-full p-2 outline-none border-b-2 border-transparent focus:border-blue-500">
            </div>

            <button type="submit" class="bg-orange-500 text-white px-10 py-4 rounded-xl font-bold hover:bg-orange-600 transition-all flex items-center justify-center">
                <i data-lucide="search" class="mr-2"></i> TÌM KIẾM
            </button>
        </form>
    </div>
</header>

<section class="max-w-7xl mx-auto -mt-10 px-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="bg-white p-6 rounded-xl shadow-lg border border-slate-50 text-center">
            <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="shield-check"></i>
            </div>
            <h4 class="font-bold">An toàn tuyệt đối</h4>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-lg border border-slate-50 text-center">
            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="armchair"></i>
            </div>
            <h4 class="font-bold">Giữ chỗ 15 phút</h4>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-lg border border-slate-50 text-center">
            <div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="clock"></i>
            </div>
            <h4 class="font-bold">Hỗ trợ 24/7</h4>
        </div>
    </div>
</section>

<script>lucide.createIcons();</script>
</body>
</html>
