<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8">
<div class="max-w-4xl mx-auto">
    <h2 class="text-2xl font-bold mb-6">Chuyến xe từ <span th:text="${departure}"></span> đến <span th:text="${destination}"></span></h2>

    <div th:if="${#lists.isEmpty(trips)}" class="bg-white p-6 rounded-xl shadow text-center">
        <p class="text-slate-500">Rất tiếc, không có chuyến xe nào vào ngày này.</p>
        <a href="/" class="text-blue-500 hover:underline">Quay lại tìm kiếm</a>
    </div>

    <div class="space-y-4">
        <div th:each="trip : ${trips}" class="bg-white p-6 rounded-xl shadow-md flex justify-between items-center">
            <div>
                <p class="font-bold text-lg" th:text="${#temporals.format(trip.departureTime, 'HH:mm')}"></p>
                <p class="text-sm text-slate-500" th:text="${trip.route.departure.name}"></p>
            </div>
            <div class="text-center">
                <p class="text-blue-600 font-bold" th:text="${#numbers.formatDecimal(trip.price, 0, 'COMMA', 0, 'POINT') + 'đ'}"></p>
                <p class="text-xs text-slate-400" th:text="${trip.bus.busType}"></p>
            </div>
            <a th:href="@{/booking/select-seat(tripId=${trip.id})}"
               class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700">
                Chọn ghế
            </a>
        </div>
    </div>
</div>
</body>
</html>
