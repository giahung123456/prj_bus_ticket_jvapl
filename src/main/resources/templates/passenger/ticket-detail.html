<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="max-w-2xl mx-auto bg-white shadow-2xl rounded-lg overflow-hidden border-t-8 border-blue-600">
    <div class="p-6 text-center border-b">
        <h2 class="text-2xl font-bold text-gray-800">THÔNG TIN VÉ XE</h2>
        <p class="text-blue-600 font-mono text-xl" th:text="${ticket.ticketCode}"></p>
    </div>

    <div class="p-8 grid grid-cols-2 gap-6 text-sm">
        <div>
            <p class="text-gray-500 uppercase">Khách hàng</p>
            <p class="font-bold text-lg" th:text="${ticket.customerName}"></p>
        </div>
        <div>
            <p class="text-gray-500 uppercase">Số điện thoại</p>
            <p class="font-bold text-lg" th:text="${ticket.customerPhone}"></p>
        </div>
        <div class="col-span-2 bg-blue-50 p-4 rounded-lg">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-blue-500">Tuyến đường</p>
                    <p class="font-bold text-xl" th:text="${ticket.departureLocation + ' ➔ ' + ticket.destinationLocation}"></p>
                </div>
                <div class="text-right">
                    <p class="text-blue-500">Ghế</p>
                    <p class="font-bold text-xl text-orange-600" th:text="${ticket.seatNumber}"></p>
                </div>
            </div>
        </div>
        <div>
            <p class="text-gray-500 uppercase">Khởi hành</p>
            <p class="font-bold" th:text="${#temporals.format(ticket.departureTime, 'HH:mm - dd/MM/yyyy')}"></p>
        </div>
        <div>
            <p class="text-gray-500 uppercase">Biển số xe</p>
            <p class="font-bold" th:text="${ticket.busPlateNumber}"></p>
        </div>
        <div class="col-span-2 border-t pt-4 flex justify-between items-center">
            <span class="text-gray-600">Trạng thái:
                <span class="px-2 py-1 bg-green-100 text-green-700 rounded-full font-bold" th:text="${ticket.status}"></span>
            </span>
            <span class="text-2xl font-bold text-blue-700" th:text="${#numbers.formatDecimal(ticket.totalPrice, 0, 'COMMA', 0, 'POINT') + 'đ'}"></span>
        </div>
    </div>
</div>
</body>
</html>
