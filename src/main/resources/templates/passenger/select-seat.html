<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50">

<main class="max-w-4xl mx-auto py-10 px-4">
    <div class="text-center mb-8">
<!--        <h2 class="text-3xl font-bold text-slate-800" th:text="${trip.bus.busType}">Loại xe</h2>-->
<!--        <p class="text-slate-500 mt-2" th:text="${trip.route.departure.name + ' ➔ ' + trip.route.destination.name}"></p>-->
        <h2 th:text="${trip?.bus?.busType ?: 'Loại xe'}"></h2>
        <p th:text="${(trip?.route?.departure?.name ?: '...') + ' ➔ ' + (trip?.route?.destination?.name ?: '...')}"></p>
        <p class="text-sm font-medium text-orange-600" th:text="${#temporals.format(trip.departureTime, 'HH:mm - dd/MM/yyyy')}"></p>
    </div>

    <div class="flex justify-center space-x-6 mb-8 text-sm">
        <div class="flex items-center"><div class="w-5 h-5 bg-white border-2 border-slate-300 rounded mr-2"></div> Trống</div>
        <div class="flex items-center"><div class="w-5 h-5 bg-blue-500 rounded mr-2"></div> Đang chọn</div>
        <div class="flex items-center"><div class="w-5 h-5 bg-slate-300 rounded mr-2"></div> Đã đặt</div>
    </div>
    <p th:text="'Số lượng ghế: ' + ${seats.size()}"></p>
    <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">

        <div th:if="${trip.bus.busType == 'Giường nằm'}" class="grid grid-cols-1 md:grid-cols-2 gap-12">
            <div>
                <h3 class="text-center font-bold text-slate-400 mb-4 uppercase tracking-widest text-xs">Tầng dưới</h3>
                <div class="grid grid-cols-3 gap-4 border-2 border-dashed border-slate-200 p-4 rounded-2xl">

                    <th:block th:each="sItem : ${seats}">
                        <div th:if="${sItem != null and #strings.startsWith(sItem.seatNumber, 'A')}"
                             th:insert="~{::seat-fragment(seatObj=${sItem})}"></div>
                    </th:block>
                </div>
            </div>

            <div>
                <h3 class="text-center font-bold text-slate-400 mb-4 uppercase tracking-widest text-xs">Tầng trên</h3>
                <div class="grid grid-cols-3 gap-4 border-2 border-dashed border-slate-200 p-4 rounded-2xl">

                    <!-- Tầng trên -->
                    <th:block th:each="sItem : ${seats}">
                        <div th:if="${sItem != null and #strings.startsWith(sItem.seatNumber, 'B')}"
                             th:insert="~{::seat-fragment(seatObj=${sItem})}"></div>
                    </th:block>
                </div>
            </div>
        </div>

        <!-- Phần dành cho xe Ghế ngồi / Limousine (Không phải Giường nằm) -->
        <div th:unless="${trip.bus.busType == 'Giường nằm'}" class="max-w-md mx-auto">
            <h3 class="text-center font-bold text-slate-400 mb-4 uppercase tracking-widest text-xs">Sơ đồ ghế</h3>


            <div class="grid gap-4 border-2 border-dashed border-slate-200 p-6 rounded-2xl"
                 th:classappend="${trip.bus.busType.contains('Limousine') ? 'grid-cols-3' : 'grid-cols-4'}">


                <th:block th:each="sItem : ${seats}">
                    <div th:if="${sItem != null}"
                         th:insert="~{::seat-fragment(seatObj=${sItem})}"></div>
                </th:block>
            </div>
        </div>

        <div class="mt-10 pt-6 border-t border-slate-100 flex justify-between items-center">
            <div>
                <p class="text-slate-500 text-sm">Giá vé niêm yết:</p>
                <p class="text-2xl font-bold text-blue-600" th:text="${#numbers.formatDecimal(trip.price, 0, 'COMMA', 0, 'POINT') + 'đ'}"></p>
            </div>
            <a href="/" class="text-slate-400 hover:text-slate-600 font-medium flex items-center">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> Quay lại
            </a>
        </div>
    </div>
</main>


<div th:fragment="seat-fragment(seatObj)"
     th:if="${seatObj != null}"
     th:id="${'seat-container-' + seatObj.id}"
     class="flex justify-center">

    <!-- Nút cho ghế KHÔNG trống (PENDING hoặc BOOKED) -->
    <button th:if="${seatObj.status != 'AVAILABLE'}"
            disabled
            th:classappend="${seatObj.status == 'PENDING' ? 'bg-blue-500 text-white' : 'bg-slate-300 text-slate-400'}"
            class="w-14 h-14 rounded-xl cursor-not-allowed flex items-center justify-center font-bold">
        <span th:text="${seatObj.seatNumber}"></span>
    </button>

    <!-- Nút cho ghế TRỐNG -->
    <a th:if="${seatObj.status == 'AVAILABLE'}"
       th:href="@{/booking/confirm(tripId=${trip.id}, seatId=${seatObj.id})}"
       class="w-14 h-14 bg-white border-2 border-blue-500 text-blue-600 rounded-xl
              flex items-center justify-center hover:bg-blue-500 hover:text-white
              transition-all duration-200 font-bold shadow-sm active:scale-90">
        <span th:text="${seatObj.seatNumber}"></span>
    </a>
</div>
<script>lucide.createIcons();</script>

    function pollSeatStatus() {
        fetch(`/api/seats/status/${tripId}`)
            .then(res => res.json())
            .then(seats => {
                seats.forEach(seat => {
                    const container = document.getElementById(`seat-container-${seat.id}`);
                    if (!container) return;

                    // 1. Nếu ghế quay lại AVAILABLE (Trường hợp bị hủy vé)
                    if (seat.status === 'AVAILABLE') {
                        if (container.querySelector('button')) { // Nếu đang hiện nút khóa
                            container.innerHTML = `
                            <a href="/booking/confirm?tripId=${tripId}&seatId=${seat.id}"
                               class="w-14 h-14 bg-white border-2 border-blue-500 text-blue-600 rounded-xl flex items-center justify-center hover:bg-blue-500 hover:text-white transition-all duration-200 font-bold shadow-sm">
                                <span>${seat.seatNumber}</span>
                            </a>`;
                        }
                    }
                    // 2. Nếu ghế là PENDING hoặc BOOKED (Cần khóa hoặc đổi màu)
                    else {
                        const colorClass = (seat.status === 'PENDING') ? 'bg-blue-500 text-white' : 'bg-slate-300 text-slate-400';
                        const currentButton = container.querySelector('button');

                        // Nếu chưa có nút bấm hoặc ĐÃ CÓ NÚT BẤM NHƯNG SAI MÀU (đổi từ PENDING sang BOOKED)
                        if (!currentButton || !currentButton.classList.contains(seat.status === 'PENDING' ? 'bg-blue-500' : 'bg-slate-300')) {
                            container.innerHTML = `
                            <button disabled class="w-14 h-14 ${colorClass} rounded-xl cursor-not-allowed flex items-center justify-center font-bold">
                                <span>${seat.seatNumber}</span>
                            </button>`;
                        }
                    }
                });
            });
    }
    // Chạy polling mỗi 3 giây
    setInterval(pollSeatStatus, 3000);

</body>
</html>
