<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử chuyến đi của tôi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .ticket-cutout {
            position: relative;
            background-image: radial-gradient(circle at 0 50%, transparent 10px, white 10px),
            radial-gradient(circle at 100% 50%, transparent 10px, white 10px);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

<nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
        <a href="/" class="flex items-center text-blue-600 font-bold text-lg">
            <i data-lucide="chevron-left" class="mr-2"></i> Quay lại
        </a>
        <h1 class="text-slate-800 font-bold">Lịch sử đặt vé</h1>
        <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-bold">
            <span th:text="${session.loggedInUser.profile != null ? #strings.substring(session.loggedInUser.profile.fullName, 0, 1) : 'U'}">U</span>
        </div>
    </div>
</nav>

<main class="max-w-3xl mx-auto py-8 px-4">
    <div th:if="${#lists.isEmpty(tickets)}" class="text-center py-20">
        <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 inline-block">
            <i data-lucide="bus" class="w-16 h-16 mx-auto text-slate-200 mb-4"></i>
            <p class="text-slate-500 text-lg font-medium">Bạn chưa có chuyến đi nào.</p>
            <a href="/" class="mt-4 inline-block bg-blue-600 text-white px-6 py-2 rounded-full font-semibold hover:bg-blue-700 transition">Đặt vé ngay</a>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(tickets)}" class="space-y-6">
        <div th:each="t : ${tickets}" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">

            <div class="p-4 border-b border-dashed border-slate-200 flex justify-between items-center bg-slate-50/50">
                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-black uppercase tracking-wider text-slate-400">Mã vé</span>
                    <span class="font-mono font-bold text-blue-600" th:text="${t.ticketCode}">BT-123456</span>
                </div>
                <span th:if="${t.status.name() == 'PAID'}" class="flex items-center gap-1 text-green-600 bg-green-100 px-3 py-1 rounded-full text-xs font-bold">
                        <i data-lucide="check-circle" class="w-3 h-3"></i> Đã thanh toán
                    </span>
                <span th:if="${t.status.name() == 'PENDING'}" class="flex items-center gap-1 text-orange-600 bg-orange-100 px-3 py-1 rounded-full text-xs font-bold">
                        <i data-lucide="clock" class="w-3 h-3"></i> Chờ thanh toán
                    </span>
                <span th:if="${t.status.name() == 'CANCELLED'}" class="flex items-center gap-1 text-red-600 bg-red-100 px-3 py-1 rounded-full text-xs font-bold">
                        <i data-lucide="x-circle" class="w-3 h-3"></i> Đã hủy
                    </span>
            </div>

            <div class="p-6">
                <div class="flex items-center justify-between mb-6">
                    <div class="text-left">
                        <p class="text-xs text-slate-400 uppercase font-bold tracking-tight">Điểm đi</p>
                        <h3 class="text-xl font-bold text-slate-800" th:text="${t.trip.route.departure.name}">Hà Nội</h3>
                    </div>

                    <div class="flex flex-col items-center px-4 flex-1">
                        <div class="w-full border-t-2 border-dotted border-slate-200 relative mt-4">
                            <i data-lucide="bus" class="w-5 h-5 text-blue-500 absolute -top-2.5 left-1/2 -translate-x-1/2 bg-white px-1"></i>
                        </div>
                    </div>

                    <div class="text-right">
                        <p class="text-xs text-slate-400 uppercase font-bold tracking-tight">Điểm đến</p>
                        <h3 class="text-xl font-bold text-slate-800" th:text="${t.trip.route.destination.name}">Hải Phòng</h3>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 text-sm bg-slate-50 p-4 rounded-xl font-medium">
                    <div class="flex items-center gap-2 text-slate-600 border-r border-slate-200">
                        <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i>
                        <span th:text="${#temporals.format(t.trip.departureTime, 'dd/MM/yyyy')}"></span>
                    </div>
                    <div class="flex items-center gap-2 text-slate-600 pl-2">
                        <i data-lucide="clock" class="w-4 h-4 text-slate-400"></i>
                        <span th:text="${#temporals.format(t.trip.departureTime, 'HH:mm')}"></span>
                    </div>
                </div>
            </div>

            <div class="px-6 py-4 bg-white flex items-center justify-between border-t border-slate-100">
                <div>
                    <p class="text-[10px] text-slate-400 uppercase font-bold">Số tiền</p>
                    <p class="text-lg font-black text-slate-900"
                       th:text="${#numbers.formatDecimal(t.totalPrice, 0, 'COMMA', 0, 'POINT') + 'đ'}">200.000đ</p>
                </div>
                <a th:href="@{/tickets/lookup(code=${t.ticketCode}, phone=${t.customerPhone})}"
                   class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all flex items-center">
                    Chi tiết <i data-lucide="chevron-right" class="ml-1 w-4 h-4"></i>
                </a>
            </div>
        </div>
    </div>
</main>

<footer class="mt-12 pb-8 text-center text-slate-400 text-xs">
    <p>© 2026 BusTicket Express - Chúc bạn có những chuyến đi an toàn</p>
</footer>

<script>lucide.createIcons();</script>
</body>
</html>
