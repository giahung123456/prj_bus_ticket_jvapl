<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

<div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
    <div class="text-center mb-8">
        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <i data-lucide="search" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-slate-800">Tra cứu vé của bạn</h2>
        <p class="text-slate-500 mt-2">Vui lòng cung cấp mã vé và số điện thoại để tiếp tục</p>
    </div>

    <div th:if="${error}" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm">
        <p th:text="${error}"></p>
    </div>

    <form th:action="@{/tickets/detail}" method="get" class="space-y-6">
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Mã vé (Ticket Code)</label>
            <input type="text" name="code" placeholder="VD: TCK-XXXXXXXX" required
                   class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition-all uppercase">
        </div>

        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Số điện thoại</label>
            <input type="tel" name="phone" placeholder="Nhập số điện thoại đặt vé" required
                   class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all active:scale-95">
            KIỂM TRA THÔNG TIN
        </button>

        <a href="/" class="block text-center text-slate-400 text-sm hover:text-blue-600 mt-4 transition-colors">
            <i data-lucide="arrow-left" class="inline w-4 h-4"></i> Quay lại trang chủ
        </a>
    </form>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
