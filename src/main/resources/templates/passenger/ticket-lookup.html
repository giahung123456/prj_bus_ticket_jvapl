    <div class="text-center mb-8">
        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <i data-lucide="search" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-slate-800">Tra cứu vé của bạn</h2>
        <p class="text-slate-500 mt-2">Vui lòng cung cấp mã vé và số điện thoại để tiếp tục</p>
    </div>

    <div th:if="${error}" class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm">
        <p th:text="${error}"></p>
    </div>

    <form th:action="@{/tickets/detail}" method="get" class="space-y-6">
        <!-- Trường Mã Vé -->
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Mã vé (Ticket Code)</label>
            <input type="text" name="code"
                   th:value="${inputCode}"
                   placeholder="VD: TCK-XXXXXXXX"
                   class="w-full px-4 py-3 rounded-xl border outline-none transition-all uppercase"
                   th:classappend="${errorCode} ? 'border-red-500 bg-red-50' : 'border-slate-200 focus:ring-2 focus:ring-blue-500'">
            <!-- Thông báo lỗi mã vé -->
            <p class="text-red-500 text-xs mt-1" th:if="${errorCode}" th:text="${errorCode}"></p>
        </div>

        <!-- Trường Số Điện Thoại -->
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Số điện thoại</label>
            <input type="tel" name="phone"
                   th:value="${inputPhone != null ? inputPhone : session.loggedInUser.profile.phoneNumber}"
                   placeholder="Nhập số điện thoại đặt vé"
                   class="w-full px-4 py-3 rounded-xl border outline-none transition-all"
                   th:classappend="${errorPhone} ? 'border-red-500 bg-red-50' : 'border-slate-200 focus:ring-2 focus:ring-blue-500'">
            <!-- Thông báo lỗi số điện thoại -->
            <p class="text-red-500 text-xs mt-1" th:if="${errorPhone}" th:text="${errorPhone}"></p>
        </div>

        <!-- Thông báo lỗi chung từ hệ thống (nếu không tìm thấy vé) -->
        <div th:if="${error}" class="p-3 bg-red-50 text-red-700 text-xs rounded-lg border border-red-200 italic">
            <i data-lucide="alert-triangle" class="inline w-3 h-3 mr-1"></i>
            <span th:text="${error}"></span>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all active:scale-95">
            KIỂM TRA THÔNG TIN
        </button>
    </form>
</div>

<script>lucide.createIcons();</script>
</body>
