<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800">
<div class="max-w-2xl mx-auto py-12 px-4">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="bg-blue-600 p-6 text-white flex items-center justify-between">
            <h2 class="text-xl font-bold flex items-center">
                <i data-lucide="user-circle" class="mr-2"></i> Thông tin tài khoản
            </h2>
            <th:block th:if="${session.loggedInUser != null}">
                <a th:href="${session.loggedInUser.role.name() == 'ADMIN' ? '/admin/index' :
             (session.loggedInUser.role.name() == 'STAFF' ? '/staff/tickets' : '/')}"
                   class="text-sm bg-blue-700 px-3 py-1 rounded-lg hover:bg-blue-800 transition">
                    Quay lại
                </a>
            </th:block>
        </div>

        <div th:if="${successMsg}" class="m-6 p-3 bg-green-100 text-green-700 rounded-lg text-sm" th:text="${successMsg}"></div>

        <form th:action="@{/profile/update}" th:object="${profile}" method="post" class="p-8 space-y-6">

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Tên đăng nhập</label>
                <input type="text" th:value="${session.loggedInUser.username}" disabled
                       class="w-full bg-gray-100 border border-gray-200 rounded-xl p-3 text-gray-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Họ và tên</label>
                <input type="text" th:field="*{fullName}"
                       class="w-full p-3 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Số điện thoại</label>
                <input type="text" th:field="*{phoneNumber}" class="w-full p-3 border border-gray-200 rounded-xl">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Email</label>
                <input type="email" th:field="*{email}" class="w-full p-3 border border-gray-200 rounded-xl">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700">
                Cập nhật hồ sơ
            </button>
        </form>
    </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
