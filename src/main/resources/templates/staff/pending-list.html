<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="max-w-6xl mx-auto p-6">
  <h2 class="text-2xl font-bold mb-6 text-slate-800">Danh sách vé chờ thanh toán</h2>

  <div th:if="${success}" class="bg-green-100 text-green-700 p-4 rounded-lg mb-4" th:text="${success}"></div>
  <div th:if="${error}" class="bg-red-100 text-red-700 p-4 rounded-lg mb-4" th:text="${error}"></div>

  <table class="w-full bg-white rounded-xl shadow-lg overflow-hidden">
    <thead class="bg-slate-100 text-slate-600 uppercase text-xs font-bold">
    <tr>
      <th class="p-4 text-left">Mã vé</th>
      <th class="p-4 text-left">Khách hàng</th>
      <th class="p-4 text-left">Chuyến</th>
      <th class="p-4 text-left">Ghế</th>
      <th class="p-4 text-center">Thao tác</th>
    </tr>
    </thead>
    <tbody class="divide-y divide-slate-100">
    <tr th:each="t : ${tickets}" class="hover:bg-slate-50">
      <td class="p-4 font-mono font-bold text-blue-600" th:text="${t.ticketCode}"></td>
      <td class="p-4">
        <p class="font-bold" th:text="${t.customerName}"></p>
        <p class="text-xs text-slate-400" th:text="${t.customerPhone}"></p>
      </td>
      <td class="p-4 text-sm" th:text="${t.trip.route.departure.name + ' - ' + t.trip.route.destination.name}"></td>
      <td class="p-4 font-bold text-orange-500" th:text="${t.seat.seatNumber}"></td>
      <td class="p-4 flex justify-center gap-2">
        <form th:action="@{'/staff/confirm-payment/' + ${t.id}}" method="post">
          <button class="bg-green-500 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-green-600">Xác nhận</button>
        </form>
        <form th:action="@{'/staff/cancel-ticket/' + ${t.id}}" method="post">
          <button class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-red-600"
                  onclick="return confirm('Bạn có chắc muốn hủy vé này?')">Hủy vé</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
