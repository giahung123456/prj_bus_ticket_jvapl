<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen">

<nav class="bg-white shadow-md p-4 flex justify-between items-center px-10 sticky top-0 z-50">
<!--    <div class="flex items-center text-orange-600 font-bold text-xl">-->
<!--        <i data-lucide="ticket" class="mr-2"></i> STAFF PORTAL-->
<!--    </div>-->
    <div class="flex items-center text-orange-600 font-bold text-xl">
        <a th:href="@{/staff/tickets}" class="flex items-center">
            <i data-lucide="ticket" class="mr-2"></i> STAFF PORTAL
        </a>
    </div>
    <div class="flex items-center space-x-6">
        <a th:href="@{/staff/tickets}" class="font-bold text-orange-600 border-b-2 border-orange-600 pb-1">Duyệt vé</a>
        <a th:href="@{/staff/seats}" class="font-medium text-slate-700 hover:text-orange-600">Quản lý sơ đồ</a>
        <a th:href="@{/profile}" class="flex items-center font-medium text-slate-700 hover:text-orange-600">
            <i data-lucide="circle-user" class="w-5 h-5 mr-1"></i> Hồ sơ
        </a>
        <a th:href="@{/logout}" class="bg-slate-800 text-white px-4 py-2 rounded-lg hover:bg-slate-700 transition-colors shadow-sm">
            Đăng xuất
        </a>
    </div>
</nav>

<main class="max-w-7xl mx-auto py-10 px-4">

    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">Vé chờ xác nhận thanh toán</h2>
        <div class="bg-white border px-4 py-2 rounded-full shadow-sm flex items-center">
            <span class="flex h-2 w-2 rounded-full bg-orange-500 mr-2 animate-pulse"></span>
            <span class="text-sm font-bold text-slate-600"
                  th:text="${tickets != null ? tickets.size() : 0} + ' vé đang chờ'"></span>
        </div>
    </div>

    <div th:if="${success}" class="mb-4 p-4 bg-green-100 border-l-4 border-green-500 text-green-700 font-medium rounded shadow-sm flex items-center">
        <i data-lucide="check-circle" class="w-5 h-5 mr-2"></i>
        <span th:text="${success}"></span>
    </div>

    <div th:if="${error}" class="mb-4 p-4 bg-red-100 border-l-4 border-red-500 text-red-700 font-medium rounded shadow-sm flex items-center">
        <i data-lucide="alert-circle" class="w-5 h-5 mr-2"></i>
        <span th:text="${error}"></span>
    </div>

    <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-slate-200">
        <table class="w-full text-left">
            <thead class="bg-slate-50 border-b border-slate-200">
            <tr>
                <th class="p-4 text-xs uppercase font-bold text-slate-500 tracking-wider">Mã vé</th>
                <th class="p-4 text-xs uppercase font-bold text-slate-500 tracking-wider">Khách hàng</th>
                <th class="p-4 text-xs uppercase font-bold text-slate-500 tracking-wider">Chuyến đi & Ghế</th>
                <th class="p-4 text-xs uppercase font-bold text-slate-500 tracking-wider">Tổng tiền</th>
                <th class="p-4 text-xs uppercase font-bold text-slate-500 tracking-wider text-center">Thao tác</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
            <tr th:each="t : ${tickets}" class="hover:bg-orange-50/30 transition-colors">
                <td class="p-4">
                    <span class="font-mono font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded" th:text="${t.ticketCode}">#BT12345</span>
                </td>
                <td class="p-4">
                    <div class="font-bold text-slate-800" th:text="${t.customerName}"></div>
                    <div class="text-xs text-slate-500 italic" th:text="${t.customerPhone}">0987xxx</div>
                </td>
                <td class="p-4">
                    <div class="text-sm">
                        <p class="font-semibold text-slate-700" th:text="${t.trip.route.departure.name + ' ➔ ' + t.trip.route.destination.name}"></p>
                        <p class="text-[11px] text-slate-400 mt-1 uppercase font-bold">
                            Ghế: <span class="text-orange-600" th:text="${t.seat.seatNumber}">A1</span> |
                            <span th:text="${#temporals.format(t.trip.departureTime, 'HH:mm dd/MM/yyyy')}"></span>
                        </p>
                    </div>
                </td>
                <td class="p-4">
                    <span class="font-bold text-blue-700 text-lg"
                          th:text="${#numbers.formatDecimal(t.totalPrice, 0, 'COMMA', 0, 'POINT') + 'đ'}">150,000đ</span>
                </td>
                <td class="p-4">
                    <div class="flex justify-center items-center gap-2">
                        <form th:action="@{'/staff/confirm-payment/' + ${t.id}}" method="post">
                            <button type="submit" class="flex items-center bg-green-500 text-white px-4 py-2 rounded-lg font-bold text-sm shadow-sm hover:bg-green-600 transition-all active:scale-95">
                                <i data-lucide="check" class="w-4 h-4 mr-1"></i> Duyệt
                            </button>
                        </form>

                        <form th:action="@{'/staff/cancel-ticket/' + ${t.id}}" method="post">
                            <button type="submit"
                                    onclick="return confirm('Hành động này sẽ hủy vé và giải phóng ghế. Bạn chắc chắn chứ?')"
                                    class="flex items-center bg-red-50 text-red-600 px-4 py-2 rounded-lg font-bold text-sm border border-red-100 hover:bg-red-100 transition-all active:scale-95">
                                <i data-lucide="x" class="w-4 h-4 mr-1"></i> Hủy
                            </button>
                        </form>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(tickets)}">
                <td colspan="5" class="p-20 text-center">
                    <div class="flex flex-col items-center">
                        <i data-lucide="inbox" class="w-12 h-12 text-slate-300 mb-2"></i>
                        <p class="text-slate-400 font-medium">Hiện không có vé nào chờ xác nhận.</p>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script>lucide.createIcons();</script>
</body>
</html>
